services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - umami-db:/var/lib/postgresql/data
    # Bind to loopback so other host-side services (e.g. vpn-monitor collector)
    # can reach Postgres without going through the docker network.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  umami:
    # Built from source so BASE_PATH gets baked into the Next.js bundle —
    # the prebuilt postgresql-latest image has no basePath, which breaks
    # the /_next/* and /api/* asset paths under the /umami subroute.
    build:
      context: https://github.com/umami-software/umami.git#master
      args:
        BASE_PATH: /umami
        DATABASE_TYPE: postgresql
    image: umami-basepath:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET}
      BASE_PATH: /umami
    # Loopback only — host nginx terminates TLS and serves Umami under
    # https://<host>/umami/. See snippets/traffic-monitor.conf.
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  umami-db:
