# GoAccess configuration for the personal site.
# Run with: goaccess --config-file=goaccess.conf

# Nginx default "combined" log format
log-format COMBINED
date-format %d/%b/%Y
time-format %H:%M:%S

# Don't try to resolve hostnames (slow, and we don't want geo lookups for now)
real-os true
agent-list true

# Ignore noise: status checks, robots, favicons
ignore-crawlers true
ignore-status 404
