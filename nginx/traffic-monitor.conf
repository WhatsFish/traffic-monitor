# Include this snippet INSIDE the personal-site server block:
#   include snippets/traffic-monitor.conf;
#
# Then reload nginx: sudo nginx -t && sudo systemctl reload nginx

# Umami analytics, served at /umami/. The image is rebuilt from source with
# BASE_PATH=/umami baked into the Next.js bundle, so all internal asset and
# API paths are correctly prefixed (vs. the prebuilt postgresql-latest image
# which serves at root only). proxy_pass without a trailing slash preserves
# the /umami/ prefix so Umami sees the URL it expects.
location /umami/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# GoAccess static HTML report
location /traffic/ {
    alias /home/liharr/src/traffic-monitor/goaccess/report/;
    index index.html;
    try_files $uri $uri/ =404;

    # Uncomment to require basic auth:
