# Include this snippet INSIDE the personal-site server block:
#   include snippets/traffic-monitor.conf;
#
# Then reload nginx: sudo nginx -t && sudo systemctl reload nginx

# Umami dashboard + tracker script (proxied to the local docker container)
location /analytics/ {
    proxy_pass http://127.0.0.1:3000/analytics/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# GoAccess static HTML report
location /traffic/ {
    alias /home/liharr/src/traffic-monitor/goaccess/report/;
    index index.html;
    try_files $uri $uri/ =404;

    # Uncomment to require basic auth:
    #   sudo apt-get install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd liharr
    # auth_basic "Traffic Report";
